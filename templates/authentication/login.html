<!DOCTYPE html>
{% load static %}
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06170F">
  <title>Kirish — Kangaroo Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>
  <div class="scene" id="scene" aria-hidden="true"></div>
  <a class="brand" href="index.html" aria-label="Kangaroo Home — bosh sahifa">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15 16 4l12 11v13H4z" fill="#9FE3B0"/><rect x="13" y="17" width="6" height="11" rx="1" fill="#0E2E24"/><circle cx="16" cy="12" r="2" fill="#FFC24D"/></svg>
    Kangaroo Home
  </a>
  <p class="meter" id="meter" aria-live="polite"><i></i><span id="meterText">0 / 6 deraza yondi</span></p>

  <main class="auth">
    <form class="card narrow" id="authForm" data-mode="login" method="post" novalidate>
      <h1>Uyingiz eshigi ochiq</h1>
      <p class="lead">O'z uyim — o'lan to'shagim. Hisobingizga kiring.</p>

      <p class="form-note" id="formNote" role="status" hidden>Hisob yaratildi. Endi kirishingiz mumkin.</p>
      <p class="form-error" id="formError" role="alert" hidden></p>

      <div class="field" data-field="username">
        <div class="label-row"><label for="username">Foydalanuvchi nomi</label></div>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Foydalanuvchi nomingiz" required>
        <p class="msg" role="alert"></p>
      </div>

      <div class="field" data-field="password">
        <div class="label-row"><label for="password">Parol</label></div>
        <div class="control has-toggle">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Parolingiz" required>
          <button class="toggle" type="button" aria-pressed="false" aria-label="Parolni ko'rsatish yoki yashirish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
        </div>
        <p class="msg" role="alert"></p>
      </div>

      <button class="btn" type="submit">Kirish</button>
      <p class="switch">Hisobingiz yo'qmi? <a href="{% url 'authentication:register' %}">Ro'yxatdan o'tish</a></p>
    </form>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
